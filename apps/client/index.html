<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS prefers this over the manifest icons for "Add to Home Screen".
         Without it (and with the manifest icons 404ing, which they did) the
         home-screen tile was a screenshot of the page instead of an icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="inkboard" />
    <meta name="theme-color" content="#101012" />
    <title>inkboard</title>
    <style>
      /* overflow/overscroll here stop Safari's own page bounce/scroll from
         fighting the canvas; they don't affect tap/click. touch-action:none
         is intentionally NOT set globally, because WebKit has a real, documented
         quirk where touch-action:none on an ancestor can suppress tap-to-
         click on buttons/etc. inside it. It's scoped to just the drawing
         canvas instead, in BoardCanvas.tsx, so toolbar buttons stay tappable
         everywhere else. Confirmed against real iPad hardware. */
      html, body, #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
