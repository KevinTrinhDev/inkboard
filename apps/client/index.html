<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>inkboard</title>
    <style>
      /* Apple Pencil / touch input must reach tldraw's own pointer handling
         directly — without these, Safari intercepts a one-finger drag as
         page pan/rubber-band-scroll or pinch-zoom before the canvas ever
         sees it, which reads as "the pen acts like a mouse cursor" instead
         of drawing. Confirmed against real iPad hardware. */
      html, body, #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
