<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>inkboard</title>
    <style>
      /* overflow/overscroll here stop Safari's own page bounce/scroll from
         fighting the canvas; they don't affect tap/click. touch-action:none
         is intentionally NOT set globally — WebKit has a real, documented
         quirk where touch-action:none on an ancestor can suppress tap-to-
         click on buttons/etc. inside it. It's scoped to just the drawing
         canvas instead, in BoardCanvas.tsx, so toolbar buttons stay tappable
         everywhere else. Confirmed against real iPad hardware. */
      html, body, #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
