name: gitleaks

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans the full repo history unconditionally rather than diffing
      # against the push event's before/after SHAs — gitleaks-action's
      # range-diff mode fails with "unknown revision" on a repo's very
      # first push (the root commit has no parent to diff from).
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - run: gitleaks detect --source . --redact -v
